experiment:
  name: acrobot_dqn
  run_root: runs

seed: 123

env:
  id: Acrobot-v1
  num_envs: 1

model:
  name: mlp
  kwargs:
    hidden_sizes: [256, 256]
    activation: relu
    layer_norm: true
    orthogonal_init: false

train:
  steps: 100000
  batch_size: 128
  buffer_capacity: 50000
  learning_starts: 1000
  learning_rate: 0.001
  discount_factor: 1.0
  soft_update_rate: 0.005
  max_grad_norm: 10.0

exploration:
  schedule: linear
  start: 1.0
  end: 0.02
  decay_steps: 2500

eval:
  every_steps: 5000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
  save_plot: true
