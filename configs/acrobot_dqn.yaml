experiment:
  name: acrobot_dqn
  run_root: runs

seed: 123

env:
  id: Acrobot-v1

model:
  hidden_sizes: [256, 256]

train:
  steps: 100000
  batch_size: 64
  buffer_capacity: 100000
  learning_rate: 0.0005
  discount_factor: 0.99
  soft_update_rate: 0.005
  max_grad_norm: 10.0

exploration:
  schedule: linear
  start: 1.0
  end: 0.05
  decay_steps: 50000

eval:
  every_steps: 5000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
  save_plot: true
