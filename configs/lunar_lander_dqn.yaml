experiment:
  name: lunar_lander_dqn
  run_root: runs

seed: 123

env:
  id: LunarLander-v3
  num_envs: 1

model:
  name: mlp
  kwargs:
    hidden_sizes: [128, 128]
    activation: relu
    layer_norm: true
    orthogonal_init: false

train:
  steps: 100000
  batch_size: 32
  buffer_capacity: 50000
  learning_starts: 1000
  learning_rate: 0.001
  discount_factor: 1.0
  soft_update_rate: 0.001
  max_grad_norm: 10.0
  exploration:
    schedule: linear
    start: 1.0
    end: 0.10
    decay_steps: 2500

eval:
  every_steps: 5000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
  save_plot: true
