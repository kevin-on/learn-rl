experiment:
  name: compare_ant_ppo
  run_root: runs/continuous_action_compare

seed: 123

env:
  id: Ant-v5
  num_envs: 1
  observation_normalization: {}

model:
  name: continuous_mlp
  kwargs:
    hidden_sizes: [256, 256]
    init_log_std: -2.0
    log_std_min: -20.0
    log_std_max: 2.0

train:
  steps: 1000000
  learning_rate: 0.0000190609
  discount_factor: 0.98
  gae_lambda: 0.8
  rollout_steps: 512
  minibatch_size: 32
  epochs: 10
  clip_coef: 0.1
  value_coef: 0.677239
  entropy_coef: 0.00000049646
  max_grad_norm: 0.6
  normalize_advantages: true

eval:
  every_steps: 25000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 25000
