experiment:
  name: compare_lunar_lander_continuous_ppo
  run_root: runs/continuous_action_compare

seed: 123

env:
  id: LunarLanderContinuous-v3
  num_envs: 16

model:
  name: continuous_mlp
  kwargs:
    hidden_sizes: [256, 256]
    layer_norm: true
    init_log_std: 0.0
    log_std_min: -20.0
    log_std_max: 2.0

train:
  steps: 1000000
  learning_rate: 0.0003
  discount_factor: 0.999
  gae_lambda: 0.98
  rollout_steps: 1024
  minibatch_size: 64
  epochs: 4
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  normalize_advantages: true

eval:
  every_steps: 25000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 25000
