experiment:
  name: compare_lunar_lander_continuous_sac
  run_root: runs/continuous_action_compare

seed: 123

env:
  id: LunarLanderContinuous-v3
  num_envs: 1

model:
  name: sac_mlp
  kwargs:
    hidden_sizes: [256, 256]
    log_std_min: -20.0
    log_std_max: 2.0

train:
  steps: 1000000
  batch_size: 256
  buffer_capacity: 1000000
  learning_starts: 100
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  temperature_learning_rate: 0.0003
  initial_alpha: 1.0
  target_entropy: auto
  discount_factor: 0.99
  soft_update_rate: 0.005

eval:
  every_steps: 25000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 25000
