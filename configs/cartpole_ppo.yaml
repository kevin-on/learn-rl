experiment:
  name: cartpole_ppo
  run_root: runs

seed: 123

env:
  id: CartPole-v1
  num_envs: 8

model:
  name: discrete_mlp
  kwargs:
    hidden_sizes: [64, 64]
    activation: relu
    layer_norm: true
    orthogonal_init: false

train:
  steps: 100000
  learning_rate: 0.001
  discount_factor: 0.98
  gae_lambda: 0.8
  rollout_steps: 32
  minibatch_size: 256
  epochs: 20
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  max_grad_norm: 0.5

eval:
  every_steps: 5000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
  save_plot: true
