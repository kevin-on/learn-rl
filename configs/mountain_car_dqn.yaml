experiment:
  name: mountain_car_dqn
  run_root: runs

seed: 123

env:
  id: MountainCar-v0
  num_envs: 1

model:
  name: mlp
  kwargs:
    hidden_sizes: [256]
    layer_norm: true

train:
  steps: 250000
  batch_size: 32
  buffer_capacity: 50000
  learning_starts: 1000
  learning_rate: 0.0007
  discount_factor: 1.0
  soft_update_rate: 0.005
  max_grad_norm: 10.0
  exploration:
    schedule: linear
    start: 1.0
    end: 0.0
    decay_steps: 75000

eval:
  every_steps: 5000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
