experiment:
  name: lunar_lander_continuous_ddpg
  run_root: runs

seed: 123

env:
  id: LunarLanderContinuous-v2
  num_envs: 1

model:
  name: ddpg_mlp
  kwargs:
    hidden_sizes: [400, 300]

train:
  steps: 300000
  batch_size: 100
  buffer_capacity: 200000
  learning_starts: 10000
  actor_learning_rate: 0.001
  critic_learning_rate: 0.001
  critic_weight_decay: 0.0
  discount_factor: 0.98
  soft_update_rate: 0.005
  exploration:
    noise_type: normal
    theta: 0.15
    sigma: 0.1

eval:
  every_steps: 10000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 10000
  save_plot: true
