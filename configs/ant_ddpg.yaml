experiment:
  name: ant_ddpg
  run_root: runs

seed: 123

env:
  id: Ant-v4
  num_envs: 1

model:
  name: ddpg_mlp
  kwargs:
    hidden_sizes: [256, 256]

train:
  steps: 1000000
  batch_size: 256
  buffer_capacity: 1000000
  learning_starts: 25000
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  discount_factor: 0.99
  soft_update_rate: 0.005
  exploration:
    noise_type: normal
    theta: 0.15
    sigma: 0.1

eval:
  every_steps: 25000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 10000
