experiment:
  name: pendulum_ddpg
  run_root: runs

seed: 123

env:
  id: Pendulum-v1
  num_envs: 1

model:
  name: ddpg_mlp
  kwargs:
    hidden_sizes: [400, 300]

train:
  steps: 20000
  batch_size: 100
  buffer_capacity: 200000
  actor_learning_rate: 0.001
  critic_learning_rate: 0.001
  discount_factor: 0.98
  soft_update_rate: 0.005
  exploration:
    theta: 0.15
    sigma: 0.1

eval:
  every_steps: 1000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
