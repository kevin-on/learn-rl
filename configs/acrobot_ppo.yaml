experiment:
  name: acrobot_ppo
  run_root: runs

seed: 123

env:
  id: Acrobot-v1
  num_envs: 16

model:
  name: discrete_mlp
  kwargs:
    hidden_sizes: [64, 64]
    layer_norm: true

train:
  steps: 1000000
  learning_rate: 0.0003
  discount_factor: 0.99
  gae_lambda: 0.94
  rollout_steps: 256
  minibatch_size: 64
  epochs: 4
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  max_grad_norm: 0.5

eval:
  every_steps: 10000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
