experiment:
  name: mountain_car_a2c
  run_root: runs

seed: 123

env:
  id: MountainCar-v0
  num_envs: 16

model:
  name: discrete_mlp
  kwargs:
    hidden_sizes: [64, 64]
    layer_norm: true

train:
  steps: 1000000
  learning_rate: 0.0007
  value_loss_coef: 0.5
  discount_factor: 0.99
  rollout_steps: 5
  max_grad_norm: 0.5

eval:
  every_steps: 10000
  episodes: 10
  seed: 10000

logging:
  loss_every_steps: 1000
